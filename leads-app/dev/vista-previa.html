<!DOCTYPE html>
<html lang="es">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seguimiento de Leads</title>
<style>
  :root {
    color-scheme: light;
    --brand: #8a4f9e;
    --brand-ink: var(--brand);
    --brand-soft: color-mix(in oklab, var(--brand) 12%, var(--surface));
    --bg: #f6f5f3;
    --surface: #ffffff;
    --surface-2: #f1f0ed;
    --border: #e2e0db;
    --text: #1b1a19;
    --text-2: #5a5853;
    --text-3: #85827c;
    --ok: #1b7f4b;
    --warn-bg: #fff4d6;
    --warn-text: #6b4a00;
    --danger: #b3261e;
    --grid: #ebe9e4;
    --shadow: 0 1px 2px rgba(0,0,0,.06), 0 4px 16px rgba(0,0,0,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --brand-ink: color-mix(in oklab, var(--brand) 55%, white);
      --brand-soft: color-mix(in oklab, var(--brand) 26%, var(--surface));
      --bg: #151514;
      --surface: #1f1f1d;
      --surface-2: #2a2a27;
      --border: #3a3935;
      --text: #f3f2ee;
      --text-2: #c3c1b9;
      --text-3: #97948c;
      --ok: #5cc98d;
      --warn-bg: #3b3017;
      --warn-text: #f1d58a;
      --danger: #ff8a80;
      --grid: #2e2d2a;
      --shadow: none;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --brand-ink: color-mix(in oklab, var(--brand) 55%, white);
    --brand-soft: color-mix(in oklab, var(--brand) 26%, var(--surface));
    --bg: #151514; --surface: #1f1f1d; --surface-2: #2a2a27; --border: #3a3935;
    --text: #f3f2ee; --text-2: #c3c1b9; --text-3: #97948c; --ok: #5cc98d;
    --warn-bg: #3b3017; --warn-text: #f1d58a; --danger: #ff8a80; --grid: #2e2d2a; --shadow: none;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding-bottom: 76px;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  [hidden] { display: none !important; }

  /* Encabezado y navegación */
  .top {
    position: sticky; top: 0; z-index: 5;
    background: var(--surface); border-bottom: 1px solid var(--border);
  }
  .top-inner {
    max-width: 960px; margin: 0 auto; padding: 10px 16px;
    display: flex; align-items: center; gap: 12px;
  }
  .brand-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--brand); flex: none; }
  .top h1 { font-size: 16px; font-weight: 650; margin: 0; flex: 1; min-width: 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .icon-btn {
    border: 1px solid var(--border); background: var(--surface); border-radius: 8px;
    height: 34px; padding: 0 10px; display: inline-flex; align-items: center; gap: 6px;
    cursor: pointer; color: var(--text-2); font-size: 13px;
  }
  .icon-btn:hover { background: var(--surface-2); }
  .icon-btn svg { width: 16px; height: 16px; }
  .spin svg { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .tabs { display: flex; gap: 4px; }
  .tab {
    border: 0; background: none; cursor: pointer; padding: 8px 12px; border-radius: 8px;
    color: var(--text-2); font-weight: 550; display: inline-flex; align-items: center; gap: 6px;
  }
  .tab svg { width: 18px; height: 18px; }
  .tab[aria-selected="true"] { background: var(--brand-soft); color: var(--brand-ink); }
  .tabs.bottom {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 5;
    background: var(--surface); border-top: 1px solid var(--border);
    padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
    justify-content: space-around;
  }
  .tabs.bottom .tab { flex-direction: column; gap: 2px; font-size: 12px; padding: 6px 10px; flex: 1; }
  .tabs.header { display: none; }
  @media (min-width: 760px) {
    body { padding-bottom: 24px; }
    .tabs.bottom { display: none; }
    .tabs.header { display: flex; }
  }

  main { max-width: 960px; margin: 0 auto; padding: 16px; }
  .panel-title { font-size: 20px; font-weight: 650; margin: 4px 0 14px; }
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    box-shadow: var(--shadow); padding: 16px;
  }
  .avisos { margin-bottom: 12px; }
  .aviso { background: var(--warn-bg); color: var(--warn-text); border-radius: 10px; padding: 10px 12px; font-size: 13px; margin-bottom: 6px; }

  /* Formulario */
  .form { display: grid; gap: 14px; }
  @media (min-width: 760px) {
    .form.cols { grid-template-columns: 1fr 1fr; column-gap: 18px; }
    .form.cols .full { grid-column: 1 / -1; }
  }
  .field label.lbl, .field .lbl { display: block; font-size: 13px; font-weight: 600; color: var(--text-2); margin-bottom: 6px; }
  .req { color: var(--danger); margin-left: 2px; }
  .input {
    width: 100%; min-height: 44px; padding: 10px 12px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--surface); outline: none;
  }
  textarea.input { min-height: 84px; resize: vertical; }
  .input:focus { border-color: var(--brand-ink); box-shadow: 0 0 0 3px var(--brand-soft); }
  .field.error .input, .field.error .chips { outline: 2px solid var(--danger); outline-offset: 2px; border-radius: 10px; }
  .hint { font-size: 12px; color: var(--text-3); margin-top: 6px; }
  .field .dup { font-size: 13px; background: var(--warn-bg); color: var(--warn-text); border-radius: 8px; padding: 6px 10px; margin-top: 6px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    border: 1px solid var(--border); background: var(--surface); border-radius: 999px;
    min-height: 40px; padding: 8px 14px; cursor: pointer; font-size: 14px;
  }
  .chip:hover { background: var(--surface-2); }
  .chip[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); color: #fff; font-weight: 600; }
  .actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; }
  .btn {
    min-height: 44px; padding: 10px 18px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--surface); cursor: pointer; font-weight: 600;
  }
  .btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn:disabled { opacity: .6; cursor: wait; }

  /* Seguimiento */
  .toolbar { display: grid; gap: 10px; margin-bottom: 12px; }
  .search { position: relative; }
  .search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--text-3); }
  .search .input { padding-left: 38px; }
  .filters { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
  .filters .chip { white-space: nowrap; min-height: 34px; padding: 5px 12px; font-size: 13px; }
  .filters .chip .n { opacity: .75; margin-left: 4px; font-variant-numeric: tabular-nums; }
  .lista { display: grid; gap: 8px; }
  .lead {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 12px 14px; display: grid; grid-template-columns: 1fr auto; gap: 4px 10px;
    cursor: pointer; text-align: left; width: 100%;
  }
  .lead:hover { border-color: var(--brand-ink); }
  .lead .nombre { font-weight: 650; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lead .meta { grid-column: 1 / -1; color: var(--text-2); font-size: 13px; display: flex; flex-wrap: wrap; gap: 2px 12px; }
  .lead .foot { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 4px; }
  .lead .fecha { font-size: 12px; color: var(--text-3); }
  .badge {
    display: inline-block; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px;
    background: var(--brand-soft); color: var(--brand-ink); white-space: nowrap; align-self: start;
  }
  .accion {
    display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 650;
    padding: 3px 9px; border-radius: 999px; background: var(--warn-bg); color: var(--warn-text); white-space: nowrap;
  }
  .accion svg { width: 13px; height: 13px; }
  .lead .derecha { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
  .wa {
    display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600;
    color: var(--ok); text-decoration: none; padding: 4px 10px; border-radius: 8px; border: 1px solid var(--border);
  }
  .wa svg { width: 16px; height: 16px; }
  .vacio { text-align: center; color: var(--text-3); padding: 32px 12px; }
  .mas { display: block; margin: 12px auto 0; }

  /* Diálogo de edición */
  dialog {
    border: 0; padding: 0; border-radius: 16px; width: min(640px, calc(100vw - 24px));
    max-height: calc(100vh - 32px); background: var(--surface); color: var(--text);
    box-shadow: 0 10px 40px rgba(0,0,0,.25);
  }
  dialog::backdrop { background: rgba(0,0,0,.4); }
  .dlg-head { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--border);
    position: sticky; top: 0; background: var(--surface); z-index: 1; }
  .dlg-head h2 { font-size: 17px; margin: 0; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dlg-body { padding: 16px; }
  .dlg-foot { padding: 12px 16px; border-top: 1px solid var(--border); display: flex; gap: 10px; justify-content: flex-end;
    position: sticky; bottom: 0; background: var(--surface); }

  /* Resultados */
  .periodo { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
  .periodo select { width: auto; min-height: 38px; padding: 6px 10px; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .kpi .k-label { font-size: 13px; color: var(--text-2); font-weight: 550; }
  .kpi .k-valor { font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.2; margin-top: 4px; }
  .kpi .k-sub { font-size: 13px; color: var(--text-3); }
  .seccion { margin-bottom: 14px; }
  .seccion h3 { font-size: 15px; margin: 0 0 10px; }
  .chart { position: relative; }
  .chart svg { display: block; width: 100%; height: 220px; overflow: visible; }
  .chart .axis { fill: var(--text-3); font-size: 11px; }
  .chart .gridline { stroke: var(--grid); stroke-width: 1; }
  .chart .bar { fill: var(--brand); pointer-events: none; }
  .chart .hit { fill: transparent; cursor: default; }
  .chart .hit:hover + .bar, .chart .bar.activo { filter: brightness(1.15); }
  .tooltip {
    position: absolute; pointer-events: none; background: var(--text); color: var(--bg);
    font-size: 12px; padding: 8px 10px; border-radius: 8px; white-space: nowrap; transform: translate(-50%, -100%);
    margin-top: -8px; z-index: 2;
  }
  .tooltip b { display: block; margin-bottom: 2px; }
  table.t { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.t th { text-align: left; font-size: 12px; color: var(--text-3); font-weight: 600; padding: 6px 8px; border-bottom: 1px solid var(--border); }
  table.t td { padding: 8px; border-bottom: 1px solid var(--grid); vertical-align: middle; }
  table.t td.num, table.t th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  table.t .pct { color: var(--text-3); font-size: 12px; margin-left: 4px; }
  .barra { height: 6px; border-radius: 3px; background: var(--brand); opacity: .85; margin-top: 4px; min-width: 2px; }
  .tabla-scroll { overflow-x: auto; }
  @media (max-width: 560px) {
    table.t .pct { display: block; margin-left: 0; }
    table.t th, table.t td { padding: 6px 4px; }
    table.t th, table.t th.num { font-size: 11px; white-space: normal; }
    .icon-btn .txt { display: none; }
  }
  details summary { cursor: pointer; color: var(--text-2); font-size: 13px; margin-top: 8px; }

  /* Estados de carga */
  .centro { min-height: 60vh; display: grid; place-items: center; text-align: center; color: var(--text-2); padding: 24px; }
  .loader { width: 28px; height: 28px; border: 3px solid var(--border); border-top-color: var(--brand); border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 12px; }
  .error-box { max-width: 460px; }
  .error-box h2 { font-size: 18px; color: var(--text); }
  .toast {
    position: fixed; left: 50%; bottom: 92px; transform: translateX(-50%) translateY(20px); opacity: 0;
    background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-weight: 600;
    transition: all .2s ease; z-index: 20; pointer-events: none; max-width: calc(100vw - 32px);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.err { background: var(--danger); color: #fff; }
  @media (min-width: 760px) { .toast { bottom: 24px; } }
</style>
<script>/*
 * Simulación mínima de los servicios de Apps Script que usa Codigo.gs, sobre una
 * planilla en memoria. Sirve para los tests (Node) y para la vista previa (navegador).
 * Solo implementa lo que el código usa; un método real que falte acá falla a propósito.
 */
(function (global) {
  'use strict';

  function Validacion(tipo, valores) {
    this.tipo = tipo;
    this.valores = valores;
  }
  Validacion.prototype.getCriteriaType = function () { return this.tipo; };
  Validacion.prototype.getCriteriaValues = function () { return this.valores; };

  function Hoja(ss, nombre, filas, columnas) {
    this.ss = ss;
    this.nombre = nombre;
    this.maxFilas = filas || 1000;
    this.maxCols = columnas || 26;
    this.celdas = {}; // "f,c" -> valor
    this.validaciones = {};
    this.formatos = {};
    this.ocultas = {};
  }
  Hoja.prototype.getName = function () { return this.nombre; };
  Hoja.prototype.getParent = function () { return this.ss; };
  Hoja.prototype.getMaxRows = function () { return this.maxFilas; };
  Hoja.prototype.getMaxColumns = function () { return this.maxCols; };
  Hoja.prototype._get = function (f, c) {
    var v = this.celdas[f + ',' + c];
    return v === undefined ? '' : v;
  };
  Hoja.prototype._set = function (f, c, v) {
    if (f > this.maxFilas || c > this.maxCols) throw new Error('Fuera de la grilla: ' + f + ',' + c);
    if (v === '' || v === null || v === undefined) delete this.celdas[f + ',' + c];
    else this.celdas[f + ',' + c] = v;
  };
  Hoja.prototype.getLastRow = function () {
    var m = 0;
    Object.keys(this.celdas).forEach(function (k) { m = Math.max(m, Number(k.split(',')[0])); });
    return m;
  };
  Hoja.prototype.getLastColumn = function () {
    var m = 0;
    Object.keys(this.celdas).forEach(function (k) { m = Math.max(m, Number(k.split(',')[1])); });
    return m;
  };
  Hoja.prototype.getRange = function (f, c, nf, nc) {
    if (typeof f !== 'number' || f < 1 || c < 1) throw new Error('getRange: argumentos inválidos');
    return new Rango(this, f, c, nf || 1, nc || 1);
  };
  Hoja.prototype.getDataRange = function () {
    return this.getRange(1, 1, Math.max(1, this.getLastRow()), Math.max(1, this.getLastColumn()));
  };
  Hoja.prototype._desplazarColumnas = function (desde) {
    var nuevas = {};
    var self = this;
    ['celdas', 'validaciones', 'formatos'].forEach(function (prop) {
      var mapa = {};
      Object.keys(self[prop]).forEach(function (k) {
        var p = k.split(',').map(Number);
        mapa[p[0] + ',' + (p[1] >= desde ? p[1] + 1 : p[1])] = self[prop][k];
      });
      nuevas[prop] = mapa;
    });
    Object.keys(nuevas).forEach(function (p) { self[p] = nuevas[p]; });
    var oc = {};
    Object.keys(this.ocultas).forEach(function (c) { oc[Number(c) >= desde ? Number(c) + 1 : c] = true; });
    this.ocultas = oc;
    this.maxCols++;
  };
  Hoja.prototype.insertColumnBefore = function (c) { this._desplazarColumnas(c); return this; };
  Hoja.prototype.insertColumnAfter = function (c) { this._desplazarColumnas(c + 1); return this; };
  Hoja.prototype.insertRowsAfter = function (f, n) { this.maxFilas += n; return this; };
  Hoja.prototype.hideColumns = function (c) { this.ocultas[c] = true; };
  Hoja.prototype.setFrozenRows = function () { return this; };
  Hoja.prototype.setColumnWidth = function () { return this; };
  Hoja.prototype.setTabColor = function () { return this; };

  function Rango(hoja, f, c, nf, nc) {
    this.hoja = hoja; this.f = f; this.c = c; this.nf = nf; this.nc = nc;
  }
  Rango.prototype._cada = function (fn) {
    for (var i = 0; i < this.nf; i++) for (var j = 0; j < this.nc; j++) fn(this.f + i, this.c + j, i, j);
    return this;
  };
  Rango.prototype.getValues = function () {
    var out = [];
    for (var i = 0; i < this.nf; i++) {
      var fila = [];
      for (var j = 0; j < this.nc; j++) {
        var v = this.hoja._get(this.f + i, this.c + j);
        fila.push(v instanceof Date ? new Date(v.getTime()) : v);
      }
      out.push(fila);
    }
    return out;
  };
  Rango.prototype.getValue = function () { return this.getValues()[0][0]; };
  Rango.prototype.setValues = function (vals) {
    if (vals.length !== this.nf || vals.some(function (f) { return f.length !== this.nc; }, this)) {
      throw new Error('setValues: las dimensiones no coinciden con el rango');
    }
    var h = this.hoja;
    return this._cada(function (f, c, i, j) { h._set(f, c, vals[i][j]); });
  };
  Rango.prototype.setValue = function (v) {
    var h = this.hoja;
    return this._cada(function (f, c) {
      // Como Sheets: con formato texto plano el valor queda como string.
      if (h.formatos[f + ',' + c] === '@' && typeof v === 'string') { h._set(f, c, v); return; }
      h._set(f, c, v);
    });
  };
  Rango.prototype.setNumberFormat = function (fmt) {
    var h = this.hoja;
    return this._cada(function (f, c) { h.formatos[f + ',' + c] = fmt; });
  };
  Rango.prototype.getDataValidation = function () {
    return this.hoja.validaciones[this.f + ',' + this.c] || null;
  };
  Rango.prototype.setDataValidation = function (dv) {
    var h = this.hoja;
    return this._cada(function (f, c) { h.validaciones[f + ',' + c] = dv; });
  };
  Rango.prototype.insertCheckboxes = function () {
    var h = this.hoja;
    return this._cada(function (f, c) {
      h.validaciones[f + ',' + c] = new Validacion('CHECKBOX', []);
      h._set(f, c, false);
    });
  };
  Rango.prototype.copyFormatToRange = function (hoja, c1, c2, f1, f2) {
    if (!(hoja instanceof Hoja) || [c1, c2, f1, f2].some(function (n) { return typeof n !== 'number'; })) {
      throw new Error('copyFormatToRange: argumentos inválidos');
    }
    return this;
  };
  ['setFontWeight', 'setBackground', 'setFontColor', 'setWrap', 'setNote', 'setHorizontalAlignment']
    .forEach(function (m) { Rango.prototype[m] = function () { return this; }; });

  function Planilla(tz) {
    this.hojas = [];
    this.tz = tz || 'America/Argentina/Cordoba';
  }
  Planilla.prototype.getSheetByName = function (n) {
    return this.hojas.filter(function (h) { return h.nombre === n; })[0] || null;
  };
  Planilla.prototype.getSheets = function () { return this.hojas.slice(); };
  Planilla.prototype.insertSheet = function (n) {
    if (this.getSheetByName(n)) throw new Error('Ya existe una hoja llamada ' + n);
    var h = new Hoja(this, n);
    this.hojas.push(h);
    return h;
  };
  Planilla.prototype.getSpreadsheetTimeZone = function () { return this.tz; };
  Planilla.prototype.toast = function () {};

  var activa = new Planilla();
  var alertas = [];

  function Constructor() { this.lista = null; }
  Constructor.prototype.requireValueInList = function (l) { this.lista = l.slice(); return this; };
  Constructor.prototype.setAllowInvalid = function () { return this; };
  Constructor.prototype.build = function () { return new Validacion('VALUE_IN_LIST', [this.lista, true]); };

  var ui = {
    ButtonSet: { OK: 'OK' },
    alert: function (titulo, msg) { alertas.push({ titulo: titulo, msg: msg }); },
    createMenu: function () {
      var menu = { addItem: function () { return menu; }, addToUi: function () {} };
      return menu;
    }
  };

  global.SpreadsheetApp = {
    DataValidationCriteria: { VALUE_IN_LIST: 'VALUE_IN_LIST', VALUE_IN_RANGE: 'VALUE_IN_RANGE', CHECKBOX: 'CHECKBOX' },
    getActiveSpreadsheet: function () { return activa; },
    newDataValidation: function () { return new Constructor(); },
    getUi: function () { return ui; },
    flush: function () {}
  };

  function dos(n) { return (n < 10 ? '0' : '') + n; }
  global.Utilities = {
    // Asume que el reloj local está en la zona de la planilla (los tests usan TZ=America/Argentina/Cordoba).
    formatDate: function (d, tz, fmt) {
      if (fmt !== 'yyyy-MM-dd') throw new Error('formato no soportado en el mock: ' + fmt);
      return d.getFullYear() + '-' + dos(d.getMonth() + 1) + '-' + dos(d.getDate());
    },
    getUuid: function () {
      return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (ch) {
        var r = Math.random() * 16 | 0;
        return (ch === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
      });
    }
  };
  var bloqueado = false;
  global.LockService = {
    getScriptLock: function () {
      return {
        waitLock: function () { if (bloqueado) throw new Error('lock ya tomado'); bloqueado = true; },
        releaseLock: function () { bloqueado = false; }
      };
    }
  };
  global.Session = { getActiveUser: function () { return { getEmail: function () { return 'secretaria@ejemplo.com'; } }; } };
  global.ScriptApp = { getService: function () { return { getUrl: function () { return ''; } }; } };
  global.Logger = { log: function () {} };
  global.HtmlService = {
    createHtmlOutputFromFile: function () {
      var o = { setTitle: function (t) { o.titulo = t; return o; }, addMetaTag: function () { return o; } };
      return o;

  global.MockGAS = {

    planilla: function () { return activa; },

  };
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>/*
 * Arma una planilla de prueba con la misma forma que "Fecundart - Seguimiento de Leads"
 * (hoja Leads con 8 columnas y desplegables, hoja Resumen) y, opcionalmente, leads de demo.
 */
(function (global) {
  'use strict';

  var ENCABEZADOS = ['Fecha', 'Nombre y Apellido', 'Telefono', 'Motivo de consulta', 'Agendo turno',
    'Fecha del turno', 'Estado', 'Comentarios'];
  var ESTADOS = ['Consulta', 'Turno agendado', 'Turno realizado', 'No se presento', 'Descartado'];

  function crear(opciones) {
    opciones = opciones || {};
    var ss = MockGAS.nuevaPlanilla();
    var leads = ss.insertSheet('Leads');
    leads.maxFilas = 506;
    ss.insertSheet('Resumen').getRange(1, 1, 1, 5)
      .setValues([['Mes', 'Leads totales', 'Turnos agendados', 'Turnos realizados', '% conversion a turno']]);

    leads.getRange(1, 1, 1, 8).setValues([ENCABEZADOS]);
    leads.getRange(2, 5, 505, 1).setDataValidation(new MockGAS.Validacion('VALUE_IN_LIST', [['Si', 'No'], true]));
    if (opciones.conDesplegableEstado !== false) {
      leads.getRange(2, 7, 505, 1).setDataValidation(new MockGAS.Validacion('VALUE_IN_LIST', [ESTADOS, true]));
    }
    leads.getRange(2, 1, 1, 8).setValues([[new Date(2026, 8, 3), 'Maria Gomez (EJEMPLO)', '351 555 1234',
      'Control ginecologico', 'Si', new Date(2026, 8, 10), 'Turno agendado', 'Pidio turno por la tarde']]);

    if (opciones.demo) cargarDemo(leads, opciones.demo, opciones.hoy || new Date());
    return ss;
  }

  // Generador pseudoaleatorio fijo para que la demo sea siempre igual.
  function azar(semilla) {
    var s = semilla;
    return function () { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; };
  }

  function cargarDemo(hoja, n, hoy) {
    var r = azar(42);
    var nombres = ['Lucía', 'Sofía', 'Valentina', 'Camila', 'Martina', 'Julieta', 'Florencia', 'Agustina',
      'Paula', 'Carolina', 'Micaela', 'Rocío', 'Belén', 'Natalia', 'Romina', 'Daniela'];
    var apellidos = ['Pérez', 'González', 'Rodríguez', 'Fernández', 'López', 'Martínez', 'Sosa', 'Romero',
      'Díaz', 'Álvarez', 'Torres', 'Ruiz', 'Castro', 'Moreno', 'Ortiz', 'Silva'];
    var motivos = ['Control ginecologico', 'Control ginecologico', 'Fertilidad', 'Fertilidad', 'Fertilidad',
      'Embarazo', 'Consulta general'];
    var comentarios = ['', '', '', 'Pidió turno por la mañana', 'Consulta por obra social', 'Llamar después de las 18',
      'Vino por recomendación de una paciente'];
    var filas = [];
    for (var i = 0; i < n; i++) {
      var diasAtras = Math.floor(Math.pow(r(), 1.3) * 300);
      var f = new Date(hoy.getFullYear(), hoy.getMonth(), hoy.getDate() - diasAtras);
      var x = r();
      var reciente = diasAtras < 12;
      var estado = reciente
        ? (x < 0.45 ? 'Consulta' : x < 0.85 ? 'Turno agendado' : 'Descartado')
        : (x < 0.18 ? 'Consulta' : x < 0.3 ? 'Turno agendado' : x < 0.62 ? 'Turno realizado' : x < 0.75 ? 'No se presento' : 'Descartado');
      var agendo = /agendado|realizado|presento/.test(estado) ? 'Si' : 'No';
      var turno = agendo === 'Si' ? new Date(f.getFullYear(), f.getMonth(), f.getDate() + 3 + Math.floor(r() * 12)) : '';
      filas.push([f, nombres[Math.floor(r() * nombres.length)] + ' ' + apellidos[Math.floor(r() * apellidos.length)],
        '351 ' + (400 + Math.floor(r() * 500)) + ' ' + (1000 + Math.floor(r() * 9000)),
        motivos[Math.floor(r() * motivos.length)], agendo, turno, estado, comentarios[Math.floor(r() * comentarios.length)]]);
    }
    filas.sort(function (a, b) { return a[0] - b[0]; });
    hoja.getRange(3, 1, filas.length, 8).setValues(filas);
  }

  global.Semilla = { crear: crear, ENCABEZADOS: ENCABEZADOS, ESTADOS: ESTADOS };
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>/**
 * App de Seguimiento de Leads (Google Apps Script, vinculado a la planilla).
 *
 * La planilla es la base de datos. La hoja "Config" define qué campos tiene el
 * formulario, qué listas muestra y qué métricas calcula la pantalla de resultados.
 *
 * @OnlyCurrentDoc
 */

var HOJA_CONFIG = 'Config';
var COLUMNA_ID = 'ID';

var TIPOS = ['texto', 'texto largo', 'telefono', 'email', 'numero', 'fecha', 'lista', 'si/no'];

// Distribución de la hoja Config: tres tablas una al lado de la otra.
var BLOQUE_CAMPOS = {
  col: 1,
  titulos: ['Campo', 'Tipo', 'Opciones (separadas por coma)', 'Obligatorio', 'Ver en lista',
    'Por defecto', 'Mostrar solo si', 'Ocultar']
};
var BLOQUE_AJUSTES = { col: 10, titulos: ['Ajuste', 'Valor'] };
var BLOQUE_METRICAS = { col: 13, titulos: ['Métrica', 'Campo', 'Cuenta cuando el valor es'] };

// Etiqueta visible en Config -> clave interna.
var AJUSTES = [
  ['titulo', 'Título de la app'],
  ['hoja', 'Hoja de datos'],
  ['filaEncabezados', 'Fila de encabezados'],
  ['campoFecha', 'Campo de fecha de carga'],
  ['campoNombre', 'Campo de nombre'],
  ['campoTelefono', 'Campo de teléfono'],
  ['campoEstado', 'Campo de estado'],
  ['estadosSeguir', 'Estados a seguir'],
  ['acciones', 'Acciones por estado'],
  ['agruparPor', 'Agrupar resultados por'],
  ['prefijoWhatsapp', 'Prefijo WhatsApp'],
  ['color', 'Color principal'],
  ['tema', 'Tema']
];

var OPCIONES_ESTADO = ['Nuevo', 'Contactado', 'Turno agendado', 'Asistió', 'No asistió', 'No le interesa'];
var OPCIONES_MOTIVO = ['Control ginecológico', 'Fertilidad', 'Embarazo', 'Consulta general', 'Otro'];
var OPCIONES_ORIGEN = ['Instagram', 'Facebook', 'Google', 'WhatsApp', 'Recomendación', 'Otro'];

// ---------------------------------------------------------------------------
// Entradas: web app y menú de la planilla
// ---------------------------------------------------------------------------

function doGet() {
  var titulo = 'Seguimiento de Leads';
  try {
    titulo = leerConfig_().ajustes.titulo || titulo;
  } catch (e) {
    // Sin Config todavía: la app muestra el error al cargar datos.
  }
  return HtmlService.createHtmlOutputFromFile('Index')
    .setTitle(titulo)
    .addMetaTag('viewport', 'width=device-width, initial-scale=1');
}

function onOpen() {
  SpreadsheetApp.getUi()
    .createMenu('App de Leads')
    .addItem('Configurar / revisar planilla', 'configurarPlanillaDesdeMenu')
    .addItem('Ver link de la app', 'mostrarLinkApp')
    .addToUi();
}

function mostrarLinkApp() {
  var ui = SpreadsheetApp.getUi();
  var url = ScriptApp.getService().getUrl();
  if (url) {
    ui.alert('Link de la app', url, ui.ButtonSet.OK);
  } else {
    ui.alert('La app todavía no está publicada',
      'En el editor de Apps Script: Implementar → Nueva implementación → Aplicación web.',
      ui.ButtonSet.OK);
  }
}

/** Igual que configurarPlanilla, pero muestra el resultado en un cuadro (el menú corre con la planilla a la vista). */
function configurarPlanillaDesdeMenu() {
  var partes = configurarPlanilla();
  var ui = SpreadsheetApp.getUi();
  ui.alert('App de Leads', partes.join('\n\n'), ui.ButtonSet.OK);
}

/**
 * Crea la hoja Config a partir de las columnas actuales (si no existe) y deja la
 * hoja de datos lista: columnas faltantes, columna ID oculta e IDs completos.
 * Se puede correr todas las veces que haga falta; nunca pisa una Config existente.
 *
 * No abre cuadros de diálogo: corrida desde el editor, un alert() queda esperando en la
 * pestaña de la planilla hasta que se agota el tiempo de ejecución. El resultado va al
 * registro de ejecución y a un aviso breve en la planilla.
 */
function configurarPlanilla() {
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  var creada = false;
  if (!ss.getSheetByName(HOJA_CONFIG)) {
    crearConfig_(ss);
    creada = true;
  }
  var cfg = leerConfig_();
  var hoja = hojaDatos_(cfg);
  var nombres = cfg.campos.filter(function (c) { return c.activo; })
    .map(function (c) { return c.nombre; });
  var agregadas = asegurarColumnas_(hoja, cfg.ajustes.filaEncabezados, nombres);
  var ids = completarIds_(hoja, cfg);

  var partes = [];
  partes.push(creada ? 'Creé la hoja "Config" a partir de tus columnas. Revisala y ajustala a gusto.'
    : 'La hoja "Config" ya existía: no la modifiqué.');
  if (agregadas.length) partes.push('Agregué estas columnas a "' + hoja.getName() + '": ' + agregadas.join(', ') + '.');
  if (ids) partes.push('Asigné un ID interno a ' + ids + ' fila(s) (columna "ID", oculta).');
  var url = ScriptApp.getService().getUrl();
  if (url) partes.push('Link de la app: ' + url);

  console.log(partes.join('\n\n'));
  ss.toast(creada ? 'Listo: se creó la hoja Config.' : 'Listo: la planilla ya estaba configurada.', 'App de Leads', 8);
  return partes;
}

// ---------------------------------------------------------------------------
// API que usa la app (google.script.run)
// ---------------------------------------------------------------------------

/** Devuelve la configuración y todos los leads, listos para la interfaz. */
function obtenerDatos() {
  var cfg = leerConfig_();
  var hoja = hojaDatos_(cfg);
  var ss = hoja.getParent();
  var tz = ss.getSpreadsheetTimeZone();
  var filaEnc = cfg.ajustes.filaEncabezados;

  completarIds_(hoja, cfg);
  var mapa = mapaColumnas_(hoja, filaEnc);
  var avisos = [];

  cfg.campos.forEach(function (c) {
    var col = mapa[norm_(c.nombre)];
    if (c.activo && !col) {
      avisos.push('La columna "' + c.nombre + '" no existe todavía en la hoja; se crea sola al guardar el primer lead.');
    }
    // Una lista sin opciones en Config toma las del desplegable de la planilla.
    if (col && (c.tipo === 'lista') && !c.opciones.length) {
      c.opciones = opcionesDeValidacion_(hoja.getRange(filaEnc + 1, col));
    }
  });

  var leads = [];
  var ultima = hoja.getLastRow();
  if (ultima > filaEnc) {
    var ancho = hoja.getLastColumn();
    var valores = hoja.getRange(filaEnc + 1, 1, ultima - filaEnc, ancho).getValues();
    var colId = mapa[norm_(COLUMNA_ID)];
    valores.forEach(function (fila, i) {
      var lead = leadDesdeFila_(fila, cfg, mapa, tz);
      if (!lead) return;
      lead.id = colId ? String(fila[colId - 1]) : '';
      lead.fila = filaEnc + 1 + i;
      leads.push(lead);
    });
  }

  return {
    config: cfg,
    leads: leads,
    avisos: avisos,
    hoy: Utilities.formatDate(new Date(), tz, 'yyyy-MM-dd'),
    usuario: emailUsuario_()
  };
}

/**
 * Crea (sin id) o actualiza (con id) un lead.
 * @param {{id: string, valores: Object<string, *>}} datos valores por nombre de campo
 */
function guardarLead(datos) {
  if (!datos || typeof datos.valores !== 'object') throw new Error('Datos inválidos.');
  var lock = LockService.getScriptLock();
  lock.waitLock(20000);
  try {
    var cfg = leerConfig_();
    var hoja = hojaDatos_(cfg);
    var filaEnc = cfg.ajustes.filaEncabezados;
    var tz = hoja.getParent().getSpreadsheetTimeZone();

    var valores = datos.valores;
    // Un lead nuevo recibe el valor por defecto de los campos que no vinieron del
    // formulario, incluidos los ocultos: así se puede ocultar "Fecha" y que se complete sola.
    var defectos = datos.id ? [] : valoresPorDefecto_(cfg, valores, tz);
    if (defectos.length) {
      valores = {};
      Object.keys(datos.valores).forEach(function (k) { valores[k] = datos.valores[k]; });
      defectos.forEach(function (d) { valores[d.campo.nombre] = d.valor; });
    }
    var campos = cfg.campos.filter(function (c) {
      return (c.activo && Object.prototype.hasOwnProperty.call(valores, c.nombre)) ||
        defectos.some(function (d) { return d.campo === c; });
    });
    validarObligatorios_(cfg, valores);

    asegurarColumnas_(hoja, filaEnc, campos.map(function (c) { return c.nombre; }));
    var mapa = mapaColumnas_(hoja, filaEnc);
    var colId = mapa[norm_(COLUMNA_ID)];

    var fila, id = datos.id ? String(datos.id) : '';
    if (id) {
      fila = buscarFilaPorId_(hoja, filaEnc, colId, id);
      if (!fila) throw new Error('No encontré ese lead en la planilla (¿lo borraron?). Tocá "Actualizar" y probá de nuevo.');
    } else {
      id = nuevoId_();
      fila = ultimaFilaConDatos_(hoja, filaEnc, cfg, mapa) + 1;
      if (fila > hoja.getMaxRows()) hoja.insertRowsAfter(hoja.getMaxRows(), fila - hoja.getMaxRows());
      hoja.getRange(fila, colId).setValue(id);
    }

    campos.forEach(function (c) {
      escribirCelda_(hoja.getRange(fila, mapa[norm_(c.nombre)]), c, valores[c.nombre]);
    });
    SpreadsheetApp.flush();

    var filaValores = hoja.getRange(fila, 1, 1, hoja.getLastColumn()).getValues()[0];
    var lead = leadDesdeFila_(filaValores, cfg, mapa, tz) || { v: {} };
    lead.id = id;
    lead.fila = fila;
    return lead;
  } finally {
    lock.releaseLock();
  }
}

// ---------------------------------------------------------------------------
// Lectura de Config
// ---------------------------------------------------------------------------

function leerConfig_() {
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  var hoja = ss.getSheetByName(HOJA_CONFIG);
  if (!hoja) {
    throw new Error('Falta la hoja "Config". Abrí la planilla y usá el menú App de Leads → Configurar / revisar planilla.');
  }
  var ultima = Math.max(hoja.getLastRow(), 1);
  var ancho = Math.max(hoja.getLastColumn(), BLOQUE_METRICAS.col + BLOQUE_METRICAS.titulos.length - 1);
  var v = hoja.getRange(1, 1, ultima, ancho).getValues();

  var campos = [];
  var ajustesPorEtiqueta = {};
  var metricas = [];
  for (var r = 1; r < v.length; r++) {
    var fila = v[r];
    var nombre = texto_(fila[BLOQUE_CAMPOS.col - 1]);
    if (nombre) {
      var b = BLOQUE_CAMPOS.col - 1;
      campos.push({
        nombre: nombre,
        tipo: normalizarTipo_(fila[b + 1]),
        opciones: lista_(fila[b + 2]),
        obligatorio: bool_(fila[b + 3], false),
        verEnLista: bool_(fila[b + 4], false),
        porDefecto: texto_(fila[b + 5]),
        mostrarSi: parsearCondicion_(fila[b + 6]),
        activo: !bool_(fila[b + 7], false)
      });
    }
    var etiqueta = texto_(fila[BLOQUE_AJUSTES.col - 1]);
    if (etiqueta) ajustesPorEtiqueta[norm_(etiqueta)] = fila[BLOQUE_AJUSTES.col];

    var nombreMetrica = texto_(fila[BLOQUE_METRICAS.col - 1]);
    var campoMetrica = texto_(fila[BLOQUE_METRICAS.col]);
    if (nombreMetrica && campoMetrica) {
      metricas.push({ nombre: nombreMetrica, campo: campoMetrica, valores: lista_(fila[BLOQUE_METRICAS.col + 1]) });
    }
  }
  if (!campos.length) throw new Error('La hoja "Config" no tiene campos cargados (columna "Campo").');

  var a = {};
  AJUSTES.forEach(function (par) { a[par[0]] = ajustesPorEtiqueta[norm_(par[1])]; });
  var primero = function (tipo) {
    var c = campos.filter(function (x) { return x.tipo === tipo; })[0];
    return c ? c.nombre : '';
  };
  var ajustes = {
    titulo: texto_(a.titulo) || 'Seguimiento de Leads',
    hoja: texto_(a.hoja),
    filaEncabezados: Math.max(1, parseInt(a.filaEncabezados, 10) || 1),
    campoFecha: texto_(a.campoFecha) || primero('fecha'),
    campoNombre: texto_(a.campoNombre) || campos[0].nombre,
    campoTelefono: texto_(a.campoTelefono) || primero('telefono'),
    campoEstado: texto_(a.campoEstado),
    estadosSeguir: lista_(a.estadosSeguir),
    acciones: parsearAcciones_(a.acciones),
    agruparPor: lista_(a.agruparPor),
    prefijoWhatsapp: texto_(a.prefijoWhatsapp).replace(/\D/g, ''),
    color: /^#[0-9a-f]{6}$/i.test(texto_(a.color)) ? texto_(a.color) : '#8a4f9e',
    tema: normalizarTema_(a.tema)
  };

  return { campos: campos, ajustes: ajustes, metricas: metricas };
}

function hojaDatos_(cfg) {
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  var nombre = cfg.ajustes.hoja;
  var hoja = nombre ? ss.getSheetByName(nombre) : null;
  if (!hoja) {
    throw new Error('No encuentro la hoja de datos "' + (nombre || '(vacío)') +
      '". Revisá el ajuste "Hoja de datos" en Config.');
  }
  return hoja;
}

// ---------------------------------------------------------------------------
// Creación de Config a partir de la hoja existente
// ---------------------------------------------------------------------------

function crearConfig_(ss) {
  var hojaDatos = ss.getSheetByName('Leads') || ss.getSheets()[0];
  var filaEnc = 1;
  var ancho = Math.max(hojaDatos.getLastColumn(), 1);
  var encabezados = hojaDatos.getRange(filaEnc, 1, 1, ancho).getValues()[0]
    .map(texto_)
    .filter(function (h) { return h && norm_(h) !== norm_(COLUMNA_ID); });

  var campos = encabezados.map(function (h, i) {
    return inferirCampo_(h, hojaDatos.getRange(filaEnc + 1, i + 1));
  });
  var buscar = function (re) {
    return campos.filter(function (c) { return re.test(norm_(c.nombre)); })[0];
  };

  var fecha = campos.filter(function (c) { return c.tipo === 'fecha'; })[0];
  var nombre = buscar(/nombre/) || campos[0];
  var telefono = campos.filter(function (c) { return c.tipo === 'telefono'; })[0];
  var estado = buscar(/estado/);
  var motivo = buscar(/motivo/);
  var agendo = campos.filter(function (c) {
    return /agend/.test(norm_(c.nombre)) && c.tipo === 'lista' && esSiNo_(c.opciones);
  })[0];
  var fechaTurno = buscar(/fecha.*turno|turno.*fecha/);

  if (!campos.length) {
    nombre = { nombre: 'Nombre y Apellido', tipo: 'texto', opciones: [] };
    campos.push(nombre);
  }
  if (!estado) {
    estado = { nombre: 'Estado', tipo: 'lista', opciones: OPCIONES_ESTADO.slice() };
    campos.push(estado);
  }
  estado.tipo = 'lista';
  if (!estado.opciones.length) estado.opciones = OPCIONES_ESTADO.slice();
  if (motivo && motivo.tipo === 'texto') {
    motivo.tipo = 'lista';
    motivo.opciones = OPCIONES_MOTIVO.slice();
  }
  var origen = buscar(/origen|fuente|canal/);
  if (!origen) {
    origen = { nombre: 'Origen', tipo: 'lista', opciones: OPCIONES_ORIGEN.slice() };
    // Justo antes de Comentarios si existe, si no al final.
    var iComent = campos.indexOf(buscar(/coment|nota|observ/));
    campos.splice(iComent >= 0 ? iComent : campos.length, 0, origen);
  }

  [fecha, nombre, telefono, estado].forEach(function (c) { if (c) c.obligatorio = true; });
  [nombre, telefono, motivo, estado, fechaTurno].forEach(function (c) { if (c) c.verEnLista = true; });
  if (fecha) fecha.porDefecto = 'hoy';
  if (estado.opciones.length) estado.porDefecto = estado.opciones[0];
  if (fechaTurno && agendo) fechaTurno.mostrarSi = agendo.nombre + ' = ' + opcionSi_(agendo.opciones);

  // Estados que siguen "abiertos": los que no son un cierre.
  var cierres = /asisti|realiz|atendid|no vino|no se present|no le interesa|descart|perdid|cerrad/;
  var seguir = estado.opciones.filter(function (o) { return !cierres.test(norm_(o)); });
  var realizado = estado.opciones.filter(function (o) {
    return /asisti|realiz|atendid|vino/.test(norm_(o)) && !/^no /.test(norm_(o));
  });
  if (!realizado.length) realizado = ['Asistió'];

  var metricas = [];
  if (agendo) {
    metricas.push(['Turnos agendados', agendo.nombre, opcionSi_(agendo.opciones)]);
  } else {
    var agendados = estado.opciones.filter(function (o) { return /agend|asisti|realiz/.test(norm_(o)); });
    metricas.push(['Turnos agendados', estado.nombre, agendados.join(', ') || 'Turno agendado']);
  }
  metricas.push(['Turnos realizados', estado.nombre, realizado.join(', ')]);

  var agrupar = [motivo, origen].filter(Boolean).map(function (c) { return c.nombre; });
  var ajustes = {
    titulo: 'Seguimiento de Leads',
    hoja: hojaDatos.getName(),
    filaEncabezados: filaEnc,
    campoFecha: fecha ? fecha.nombre : '',
    campoNombre: nombre.nombre,
    campoTelefono: telefono ? telefono.nombre : '',
    campoEstado: estado.nombre,
    estadosSeguir: seguir.join(', '),
    acciones: estado.opciones.filter(function (o) { return /^no (asisti|vino|se present)/.test(norm_(o)); })
      .map(function (o) { return o + ': Recontactar'; }).join(', '),
    agruparPor: agrupar.join(', '),
    prefijoWhatsapp: '549',
    color: '#8a4f9e',
    tema: 'claro'
  };

  escribirConfig_(ss, campos, ajustes, metricas);
}

function inferirCampo_(nombre, celdaEjemplo) {
  var n = norm_(nombre);
  var opciones = opcionesDeValidacion_(celdaEjemplo);
  var tipo = 'texto';
  if (opciones.length) tipo = 'lista';
  else if (/fecha|dia\b/.test(n)) tipo = 'fecha';
  else if (/telefono|celular|whatsapp|\btel\b/.test(n)) tipo = 'telefono';
  else if (/mail/.test(n)) tipo = 'email';
  else if (/coment|nota|observ/.test(n)) tipo = 'texto largo';
  else if (/^(agendo|agendó|asistio|vino)\b/.test(n) || /^(agendo turno)$/.test(n)) {
    tipo = 'lista';
    opciones = ['Si', 'No'];
  }
  return {
    nombre: nombre, tipo: tipo, opciones: opciones, obligatorio: false, verEnLista: false,
    porDefecto: '', mostrarSi: '', activo: true
  };
}

function escribirConfig_(ss, campos, ajustes, metricas) {
  var hoja = ss.insertSheet(HOJA_CONFIG);
  var filas = Math.max(campos.length, AJUSTES.length, metricas.length) + 1;
  hoja.setTabColor('#8a4f9e');

  var bc = BLOQUE_CAMPOS.col, nc = BLOQUE_CAMPOS.titulos.length;
  // Checkboxes y desplegable de tipo en filas de sobra para que agreguen campos.
  // Van antes de los valores porque insertCheckboxes() pone todo en FALSE.
  var filasEditables = Math.max(campos.length + 15, 30);
  [4, 5, 8].forEach(function (off) {
    hoja.getRange(2, bc + off - 1, filasEditables, 1).insertCheckboxes();
  });
  hoja.getRange(2, bc + 1, filasEditables, 1).setDataValidation(
    SpreadsheetApp.newDataValidation().requireValueInList(TIPOS, true).setAllowInvalid(false).build());

  hoja.getRange(1, bc, 1, nc).setValues([BLOQUE_CAMPOS.titulos]);
  if (campos.length) {
    hoja.getRange(2, bc, campos.length, nc).setValues(campos.map(function (c) {
      return [c.nombre, c.tipo, (c.opciones || []).join(', '), !!c.obligatorio, !!c.verEnLista,
        c.porDefecto || '', c.mostrarSi || '', c.activo === false];
    }));
  }

  var ba = BLOQUE_AJUSTES.col;
  hoja.getRange(1, ba, 1, 2).setValues([BLOQUE_AJUSTES.titulos]);
  hoja.getRange(2, ba, AJUSTES.length, 2).setValues(AJUSTES.map(function (par) {
    var valor = ajustes[par[0]];
    return [par[1], valor === undefined ? '' : valor];
  }));

  var bm = BLOQUE_METRICAS.col;
  hoja.getRange(1, bm, 1, 3).setValues([BLOQUE_METRICAS.titulos]);
  if (metricas.length) hoja.getRange(2, bm, metricas.length, 3).setValues(metricas);

  [[bc, nc], [ba, 2], [bm, 3]].forEach(function (b) {
    hoja.getRange(1, b[0], 1, b[1]).setFontWeight('bold').setBackground('#efe6f3').setFontColor('#3d2447');
  });
  hoja.setFrozenRows(1);
  var anchos = { 1: 170, 2: 100, 3: 320, 4: 90, 5: 90, 6: 110, 7: 190, 8: 60, 9: 24,
    10: 190, 11: 260, 12: 24, 13: 170, 14: 170, 15: 240 };
  Object.keys(anchos).forEach(function (c) { hoja.setColumnWidth(Number(c), anchos[c]); });
  hoja.getRange(1, 1, filas, 15).setWrap(true);

  hoja.getRange(1, bc + 1).setNote('Tipos: ' + TIPOS.join(', ') + '.');
  hoja.getRange(1, bc + 2).setNote('Solo para tipo "lista". Si lo dejás vacío, usa el desplegable que tenga la columna en la hoja de datos.');
  hoja.getRange(1, bc + 5).setNote('"hoy" para fechas, o un valor fijo (por ejemplo, un estado inicial).');
  hoja.getRange(1, bc + 6).setNote('Ejemplo: Agendo turno = Si\nEl campo solo aparece cuando se cumple la condición. Se pueden poner varios valores separados por coma.');
  hoja.getRange(1, bc + 7).setNote('Tildar para ocultar un campo de la app sin borrar la columna ni sus datos.');
  hoja.getRange(1, bm + 2).setNote('Valores (separados por coma) que cuentan para esta métrica. El % se calcula sobre el total de leads.');
  hoja.getRange(1, ba).setNote('"Estados a seguir" son los que aparecen por defecto en la pestaña Seguimiento.\n' +
    '"Acciones por estado": qué hay que hacer con un lead en ese estado, por ejemplo "No asistió: Recontactar". ' +
    'Esos leads también aparecen en "A seguir" y tienen su propio filtro.\n' +
    '"Prefijo WhatsApp": 549 para celulares de Argentina.\n' +
    '"Tema": claro, oscuro o automático (sigue la configuración de cada dispositivo).');
}

// ---------------------------------------------------------------------------
// Hoja de datos
// ---------------------------------------------------------------------------

/** { nombreNormalizado: númeroDeColumna } */
function mapaColumnas_(hoja, filaEnc) {
  var ancho = Math.max(hoja.getLastColumn(), 1);
  var enc = hoja.getRange(filaEnc, 1, 1, ancho).getValues()[0];
  var mapa = {};
  enc.forEach(function (h, i) {
    var k = norm_(h);
    if (k && !mapa[k]) mapa[k] = i + 1;
  });
  return mapa;
}

/** Crea las columnas que falten (y la de ID, al final y oculta). Devuelve las creadas. */
function asegurarColumnas_(hoja, filaEnc, nombres) {
  var mapa = mapaColumnas_(hoja, filaEnc);
  var creadas = [];
  if (!mapa[norm_(COLUMNA_ID)]) {
    var col = hoja.getLastColumn() + 1;
    if (col > hoja.getMaxColumns()) hoja.insertColumnAfter(hoja.getMaxColumns());
    hoja.getRange(filaEnc, col).setValue(COLUMNA_ID);
    hoja.hideColumns(col);
    mapa = mapaColumnas_(hoja, filaEnc);
  }
  nombres.forEach(function (nombre) {
    if (mapa[norm_(nombre)]) return;
    var colId = mapa[norm_(COLUMNA_ID)];
    hoja.insertColumnBefore(colId);
    var celda = hoja.getRange(filaEnc, colId);
    if (colId > 1) hoja.getRange(filaEnc, colId - 1).copyFormatToRange(hoja, colId, colId, filaEnc, filaEnc);
    celda.setValue(nombre);
    creadas.push(nombre);
    mapa = mapaColumnas_(hoja, filaEnc);
  });
  return creadas;
}

/** Asigna ID a las filas con datos que no lo tengan. Devuelve cuántas completó. */
function completarIds_(hoja, cfg) {
  var filaEnc = cfg.ajustes.filaEncabezados;
  asegurarColumnas_(hoja, filaEnc, []);
  var mapa = mapaColumnas_(hoja, filaEnc);
  var colId = mapa[norm_(COLUMNA_ID)];
  var ultima = hoja.getLastRow();
  if (ultima <= filaEnc) return 0;
  var valores = hoja.getRange(filaEnc + 1, 1, ultima - filaEnc, hoja.getLastColumn()).getValues();
  var cols = columnasDeCampos_(cfg, mapa);
  var ids = valores.map(function (f) { return [f[colId - 1]]; });
  var n = 0;
  valores.forEach(function (f, i) {
    if (ids[i][0] === '' && filaTieneDatos_(f, cols)) {
      ids[i][0] = nuevoId_();
      n++;
    }
  });
  if (n) {
    var lock = LockService.getScriptLock();
    lock.waitLock(20000);
    try {
      hoja.getRange(filaEnc + 1, colId, ids.length, 1).setValues(ids);
    } finally {
      lock.releaseLock();
    }
  }
  return n;
}

function columnasDeCampos_(cfg, mapa) {
  return cfg.campos.map(function (c) { return mapa[norm_(c.nombre)]; }).filter(Boolean);
}

function filaTieneDatos_(fila, cols) {
  return cols.some(function (c) { return fila[c - 1] !== '' && fila[c - 1] !== null; });
}

function ultimaFilaConDatos_(hoja, filaEnc, cfg, mapa) {
  var ultima = hoja.getLastRow();
  if (ultima <= filaEnc) return filaEnc;
  var valores = hoja.getRange(filaEnc + 1, 1, ultima - filaEnc, hoja.getLastColumn()).getValues();
  var cols = columnasDeCampos_(cfg, mapa).concat([mapa[norm_(COLUMNA_ID)]]);
  for (var i = valores.length - 1; i >= 0; i--) {
    if (filaTieneDatos_(valores[i], cols)) return filaEnc + 1 + i;
  }
  return filaEnc;
}

function buscarFilaPorId_(hoja, filaEnc, colId, id) {
  var ultima = hoja.getLastRow();
  if (ultima <= filaEnc) return 0;
  var ids = hoja.getRange(filaEnc + 1, colId, ultima - filaEnc, 1).getValues();
  for (var i = 0; i < ids.length; i++) {
    if (String(ids[i][0]) === id) return filaEnc + 1 + i;
  }
  return 0;
}

function leadDesdeFila_(fila, cfg, mapa, tz) {
  var v = {};
  var tieneDatos = false;
  cfg.campos.forEach(function (c) {
    var col = mapa[norm_(c.nombre)];
    if (!col) return;
    var x = serializar_(fila[col - 1], tz);
    if (x !== '') tieneDatos = true;
    v[c.nombre] = x;
  });
  return tieneDatos ? { v: v } : null;
}

function serializar_(valor, tz) {
  if (valor instanceof Date) return Utilities.formatDate(valor, tz, 'yyyy-MM-dd');
  if (valor === true) return 'Si';
  if (valor === false) return 'No';
  if (valor === null || valor === undefined) return '';
  if (typeof valor === 'number') return valor;
  return String(valor).trim();
}

function escribirCelda_(celda, campo, valor) {
  var s = valor === null || valor === undefined ? '' : String(valor).trim();
  switch (campo.tipo) {
    case 'fecha':
      var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s);
      if (m) {
        celda.setNumberFormat('dd/mm/yyyy').setValue(new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3])));
      } else {
        celda.setValue('');
      }
      return;
    case 'numero':
      var n = Number(s.replace(',', '.'));
      celda.setValue(s === '' || isNaN(n) ? s : n);
      return;
    default:
      // Texto plano: evita que "+54..." o "=..." se interpreten como fórmula o número.
      celda.setNumberFormat('@').setValue(s);
  }
}

/** [{ campo, valor }] de los campos con "Por defecto" que no vinieron en `valores`. */
function valoresPorDefecto_(cfg, valores, tz) {
  return cfg.campos.filter(function (c) {
    return c.porDefecto && !Object.prototype.hasOwnProperty.call(valores, c.nombre) &&
      (!c.mostrarSi || condicionCumplida_(c.mostrarSi, valores));
  }).map(function (c) {
    var v = c.porDefecto;
    if (c.tipo === 'fecha' && norm_(v) === 'hoy') v = Utilities.formatDate(new Date(), tz, 'yyyy-MM-dd');
    return { campo: c, valor: v };
  });
}

function validarObligatorios_(cfg, valores) {
  var faltan = cfg.campos.filter(function (c) {
    if (!c.activo || !c.obligatorio) return false;
    if (!Object.prototype.hasOwnProperty.call(valores, c.nombre)) return false;
    if (c.mostrarSi && !condicionCumplida_(c.mostrarSi, valores)) return false;
    return String(valores[c.nombre] === null || valores[c.nombre] === undefined ? '' : valores[c.nombre]).trim() === '';
  });
  if (faltan.length) {
    throw new Error('Falta completar: ' + faltan.map(function (c) { return c.nombre; }).join(', ') + '.');
  }
}

function condicionCumplida_(cond, valores) {
  var actual = norm_(valores[cond.campo]);
  return cond.valores.some(function (x) { return norm_(x) === actual; });
}

function opcionesDeValidacion_(celda) {
  try {
    var dv = celda.getDataValidation();
    if (!dv) return [];
    var tipo = dv.getCriteriaType();
    var crit = dv.getCriteriaValues();
    if (tipo === SpreadsheetApp.DataValidationCriteria.VALUE_IN_LIST) {
      return (crit[0] || []).map(texto_).filter(Boolean);
    }
    if (tipo === SpreadsheetApp.DataValidationCriteria.VALUE_IN_RANGE) {
      return crit[0].getValues().reduce(function (a, f) { return a.concat(f); }, [])
        .map(texto_).filter(Boolean);
    }
  } catch (e) {
    // Sin validación legible: la lista queda vacía.
  }
  return [];
}

// ---------------------------------------------------------------------------
// Utilidades
// ---------------------------------------------------------------------------

function norm_(s) {
  return String(s === null || s === undefined ? '' : s)
    .normalize('NFD').replace(/[̀-ͯ]/g, '')
    .toLowerCase().replace(/\s+/g, ' ').trim();
}

function texto_(v) {
  return v === null || v === undefined ? '' : String(v).trim();
}

function lista_(v) {
  return texto_(v).split(',').map(function (x) { return x.trim(); }).filter(Boolean);
}

function bool_(v, siVacio) {
  if (v === true || v === false) return v;
  var s = norm_(v);
  if (s === '') return siVacio;
  return ['si', 'x', 'true', 'verdadero', '1'].indexOf(s) >= 0;
}

function normalizarTipo_(v) {
  var s = norm_(v).replace(/\s*\/\s*/, '/');
  var alias = { 'si/no': 'si/no', 'checkbox': 'si/no', 'desplegable': 'lista', 'numero': 'numero',
    'texto largo': 'texto largo', 'parrafo': 'texto largo', 'mail': 'email', 'correo': 'email',
    'tel': 'telefono', 'celular': 'telefono' };
  if (alias[s]) return alias[s];
  return TIPOS.indexOf(s) >= 0 ? s : 'texto';
}

/** "Agendo turno = Si, Tal vez" -> { campo: 'Agendo turno', valores: ['Si', 'Tal vez'] } */
function parsearCondicion_(v) {
  var s = texto_(v);
  var i = s.indexOf('=');
  if (i <= 0) return null;
  var campo = s.slice(0, i).trim();
  var valores = lista_(s.slice(i + 1));
  return campo && valores.length ? { campo: campo, valores: valores } : null;
}

/** "No asistió: Recontactar, Nuevo: Llamar" -> [{ estado: 'No asistió', accion: 'Recontactar' }, ...] */
function parsearAcciones_(v) {
  return lista_(v).map(function (par) {
    var m = /^(.+?)\s*[:=]\s*(.+)$/.exec(par);
    return m ? { estado: m[1].trim(), accion: m[2].trim() } : null;
  }).filter(Boolean);
}

/** 'claro' (también si está vacío), 'oscuro' o 'auto'. */
function normalizarTema_(v) {
  var s = norm_(v);
  if (/^(oscuro|dark)/.test(s)) return 'oscuro';
  if (/^(auto|sistema|dispositivo)/.test(s)) return 'auto';
  return 'claro';
}

function esSiNo_(opciones) {
  var o = opciones.map(norm_).sort().join('|');
  return o === 'no|si';
}

function opcionSi_(opciones) {
  return opciones.filter(function (o) { return norm_(o) === 'si'; })[0] || 'Si';
}

function nuevoId_() {
  return Utilities.getUuid().replace(/-/g, '').slice(0, 10);
}

function emailUsuario_() {
  try {
    return Session.getActiveUser().getEmail() || '';
  } catch (e) {
    return '';
  }
}

  // google.script.run simulado: serializa como el real y responde con demora.
  var crear = function (ok, mal) {
    return new Proxy({}, {
      get: function (_, nombre) {
        if (nombre === 'withSuccessHandler') return function (fn) { return crear(fn, mal); };
        if (nombre === 'withFailureHandler') return function (fn) { return crear(ok, fn); };
        return function () {
          var args = JSON.parse(JSON.stringify(Array.prototype.slice.call(arguments)));
          setTimeout(function () {
            try {
              var r = window[nombre].apply(null, args);
              if (ok) ok(r === undefined ? null : JSON.parse(JSON.stringify(r)));
            } catch (e) {
              if (mal) mal(e); else console.error(e);
            }
          }, 350);
        };
      }
    });
  };
  window.google = { script: { run: crear(null, null) } };
  void cfg;
})();</script>

<script>

  // ---------- utilidades ----------
  function $(sel, raiz) { return (raiz || document).querySelector(sel); }
  function el(tag, attrs, hijos) {
    var n = document.createElement(tag);
